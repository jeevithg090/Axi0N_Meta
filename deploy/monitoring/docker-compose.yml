# Minimal monitoring for a Rulecam deployment (docs/deploy.md "Monitoring"): Prometheus scrapes
# the API pod's public, read-only /metrics; Grafana shows one dashboard. Run it on your laptop
# or any box (not on the pods):
#
#   cp deploy/monitoring/targets/rulecam.example.json deploy/monitoring/targets/rulecam.json
#   # put the API pod's proxy host in it, then:
#   docker compose -f deploy/monitoring/docker-compose.yml up -d
#   open http://localhost:3000   (admin / admin on first login; Prometheus on :9090)
#
# Grafana is AGPL-3.0: fine to run for yourself; do not host it for others without reading the
# license. Image tags are pinned and at least two weeks old when chosen.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:13.0.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
volumes:
  prometheus-data:
  grafana-data:
