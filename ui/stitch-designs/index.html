<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rulecam UI Design Suite — Google Stitch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#06080d] text-[#dfe2ef] min-h-screen flex flex-col">
  <!-- Top Bar -->
  <header class="border-b border-zinc-800/80 bg-[#0a0e17] px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-[#10b981]/20 border border-[#10b981] flex items-center justify-center text-[#10b981] font-bold text-sm">
        R
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
          RULECAM <span class="text-xs font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">GOOGLE STITCH DESIGNS</span>
        </h1>
        <p class="text-xs text-zinc-400 mono">Design System: Obsidian Telemetry · Project #9357530616174427445</p>
      </div>
    </div>
    <!-- Screen Tabs -->
    <nav class="flex items-center gap-2">
      <button onclick="setTab('01_monitor.html', this)" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-mono border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 font-semibold transition-all">
        1. Live Monitor (/monitor)
      </button>
      <button onclick="setTab('02_planner.html', this)" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-mono border border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200 transition-all">
        2. Planner Studio (/planner)
      </button>
      <button onclick="setTab('03_rule_ci.html', this)" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-mono border border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200 transition-all">
        3. Rule CI Suite (/ci)
      </button>
      <button onclick="setTab('04_worker_pwa.html', this, true)" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-mono border border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200 transition-all">
        4. Worker Mobile PWA (/worker)
      </button>
    </nav>
  </header>

  <!-- Viewport Frame -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 bg-[#06080d]">
    <div id="frame-container" class="w-full h-[calc(100vh-100px)] rounded-xl border border-zinc-800 overflow-hidden shadow-2xl bg-black transition-all">
      <iframe id="preview-frame" src="01_monitor.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    function setTab(url, btn, isMobile = false) {
      document.getElementById('preview-frame').src = url;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs font-mono border border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-zinc-200 transition-all';
      });
      btn.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs font-mono border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 font-semibold transition-all';
      
      const container = document.getElementById('frame-container');
      if (isMobile) {
        container.className = 'w-[420px] h-[calc(100vh-100px)] rounded-3xl border-4 border-zinc-800 overflow-hidden shadow-2xl bg-black transition-all';
      } else {
        container.className = 'w-full h-[calc(100vh-100px)] rounded-xl border border-zinc-800 overflow-hidden shadow-2xl bg-black transition-all';
      }
    }
  </script>
</body>
</html>
