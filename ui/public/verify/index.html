<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rulecam evidence check</title>
  <style>
    /* Rulecam Console tokens; system faces only, so this page loads nothing from anywhere else. */
    :root {
      color-scheme: light dark;
      --paper: oklch(97.6% 0.006 85); --panel: oklch(99.4% 0.003 85); --ink: oklch(19% 0.01 60);
      --muted: oklch(46% 0.012 60); --rule: oklch(89.5% 0.008 85); --cool: oklch(49% 0.14 250);
      --ok: oklch(48% 0.13 150); --ok-soft: oklch(94.5% 0.035 150);
      --bad: oklch(51% 0.18 27); --bad-soft: oklch(95% 0.03 25); --focus: oklch(53% 0.15 68);
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: oklch(17% 0.008 250); --panel: oklch(21% 0.009 250); --ink: oklch(95% 0.005 250);
        --muted: oklch(71% 0.01 250); --rule: oklch(31% 0.01 250); --cool: oklch(77% 0.12 245);
        --ok: oklch(76% 0.15 150); --ok-soft: oklch(24.5% 0.03 150);
        --bad: oklch(70% 0.17 25); --bad-soft: oklch(24.5% 0.035 25); --focus: oklch(82% 0.15 80);
      }
    }
    html, body { overflow-x: clip; }
    body { margin: 0 auto; padding: 48px 16px; max-width: 680px; font: 400 16px/1.55 var(--sans);
           color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
    h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 15px; }
    #verdict { margin: 32px 0 12px; padding: 20px 24px; border: 1px solid var(--rule); border-radius: 10px;
               background: var(--panel); font: 500 20px/1.35 var(--mono); overflow-wrap: anywhere; }
    #verdict.ok { color: var(--ok); background: var(--ok-soft); border-color: currentColor; }
    #verdict.bad { color: var(--bad); background: var(--bad-soft); border-color: currentColor; }
    #detail, #root { margin-top: 8px; }
    code { font-family: var(--mono); color: var(--cool); word-break: break-all; }
    label { display: block; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule);
            color: var(--muted); font-size: 15px; }
    input[type="file"] { display: block; margin-top: 12px; font: inherit; color: var(--ink); max-width: 100%; }
    input[type="file"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Rulecam evidence check</h1>
  <p class="muted">Your browser recomputes every SHA-256 hash itself. Nothing is trusted from the server.</p>
  <div id="verdict" role="status" aria-live="polite">Loading…</div>
  <div id="detail" class="muted"></div>
  <div id="root" class="muted"></div>
  <label>Or check a chain file yourself: <input type="file" id="file" accept=".jsonl,application/x-ndjson"></label>
  <script type="module">
    import { compareToCommitted, merkleRoot, parseHashList, verifyChainText } from "./chain.js";

    const verdict = document.getElementById("verdict");
    const detail = document.getElementById("detail");
    const rootLine = document.getElementById("root");

    async function show(text, committed) {
      const report = await verifyChainText(text);
      rootLine.textContent = "";
      if (!report.ok) {
        verdict.textContent = `✗ Chain broken at event ${report.firstBadSeq}`;
        verdict.className = "bad";
        detail.textContent = report.reason;
        return;
      }
      const root = await merkleRoot(report.hashes);
      const status = committed
        ? await compareToCommitted(report.hashes, committed.root, committed.n)
        : null;
      if (status === "mismatch") {
        // Every link holds, but records were dropped, changed or the whole chain was rewritten.
        verdict.textContent = "✗ Chain does not match the committed daily root";
        verdict.className = "bad";
        detail.textContent = `${report.n} records recomputed; they do not reproduce the root in git.`;
      } else {
        const watched = report.watched === null ? "" : ` · watched ${Math.round(report.watched * 100)}%`;
        verdict.textContent = `✓ Chain intact · ${report.n} records${watched}`;
        verdict.className = "ok";
        if (status === "match") {
          detail.textContent = "✓ Matches the committed daily root.";
        } else if (status === "extended") {
          detail.textContent =
            `✓ The first ${committed.n} records match the committed daily root; ` +
            `${report.n - committed.n} were added after it was committed.`;
        } else {
          detail.textContent = "";
        }
      }
      const code = document.createElement("code");
      code.textContent = root;
      rootLine.append("Daily root: ", code);
    }

    // The public gets record hashes only (the records are the site owner's): enough to check that
    // the day's log reproduces the root committed to git.
    async function showHashes(hashes, committed) {
      const root = await merkleRoot(hashes);
      const status = committed
        ? await compareToCommitted(hashes, committed.root, committed.n)
        : null;
      if (status === "mismatch") {
        verdict.textContent = "✗ The log does not match the committed daily root";
        verdict.className = "bad";
        detail.textContent = `${hashes.length} record hashes do not reproduce the root in git.`;
      } else if (status === "match" || status === "extended") {
        verdict.textContent = `✓ ${hashes.length} record hashes match the committed daily root`;
        verdict.className = "ok";
        detail.textContent =
          status === "extended"
            ? `The first ${committed.n} match it; ${hashes.length - committed.n} were added after it was committed.`
            : "";
      } else {
        verdict.textContent = `${hashes.length} record hashes; today's root is not committed yet`;
        verdict.className = "";
        detail.textContent = "";
      }
      detail.append(
        " The records themselves are visible to the site owner only; with a chain file you can recompute every one below.",
      );
      const code = document.createElement("code");
      code.textContent = root;
      rootLine.textContent = "";
      rootLine.append("Daily root: ", code);
    }

    // A chain file published on this same site (the golden demo: `?chain=/golden/<run>/chain.jsonl`
    // with the root and record count committed to git). Only same-origin paths are fetched.
    const CHAIN_PATH = /^\/[A-Za-z0-9_\/.-]+\.jsonl$/;

    async function loadPublished(path, params) {
      if (!CHAIN_PATH.test(path) || path.includes("..")) {
        verdict.textContent = "Only a chain file on this site can be checked here.";
        return;
      }
      const reply = await fetch(path);
      if (!reply.ok) {
        verdict.textContent = `No chain file at ${path}.`;
        return;
      }
      const root = params.get("root");
      const n = Number(params.get("n"));
      const committed =
        root && /^[0-9a-f]{64}$/.test(root) && Number.isSafeInteger(n) && n > 0 ? { root, n } : null;
      await show(await reply.text(), committed);
    }

    async function loadFromServer() {
      const params = new URLSearchParams(location.search);
      const published = params.get("chain");
      if (published !== null) {
        await loadPublished(published, params);
        return;
      }
      const day = params.get("day");
      if (!day || !/^\d{4}-\d{2}-\d{2}$/.test(day)) {
        verdict.textContent = "Choose a chain file below.";
        return;
      }
      const root = await fetch(`../evidence/${day}/root`);
      const body = root.ok ? await root.json() : null;
      const committed =
        body && body.committed_root ? { root: body.committed_root, n: body.committed_n } : null;
      // The full chain is the owner's (loopback or a login session); everyone else gets hashes.
      const chain = await fetch(`../evidence/${day}/chain`);
      if (chain.ok) {
        await show(await chain.text(), committed);
        return;
      }
      const hashes = chain.status === 403 ? await fetch(`../evidence/${day}/hashes`) : chain;
      if (!hashes.ok) {
        verdict.textContent = `No chain for ${day}.`;
        return;
      }
      await showHashes(parseHashList(await hashes.json()), committed);
    }

    function fail(error) {
      verdict.textContent = "Could not check the chain.";
      verdict.className = "bad";
      detail.textContent = String(error);
      rootLine.textContent = "";
    }

    document.getElementById("file").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) file.text().then((text) => show(text, null)).catch(fail);
    });
    loadFromServer().catch(fail);
  </script>
</body>
</html>
