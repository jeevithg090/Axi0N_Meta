name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest --cov --cov-report=json
      - run: uv run python scripts/coverage_floors.py coverage.json

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run pytest tests/guardrails

  ml-cpu:
    # Torch-based tests (world model, pose, voice out). Skips cleanly until those packages exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          dirs=""
          for d in tests/worldmodel tests/pose tests/voice_out; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.dirs != ''
        uses: astral-sh/setup-uv@v3
      - if: steps.detect.outputs.dirs != ''
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: steps.detect.outputs.dirs != ''
        run: uv python install 3.12 && uv sync --group dev --extra ml
      - if: steps.detect.outputs.dirs != ''
        run: uv run pytest ${{ steps.detect.outputs.dirs }}
      - if: steps.detect.outputs.dirs == ''
        run: echo "No ML test directories yet; nothing to run."

  # The `ui` job (lint, typecheck, vitest, build) is added by P3 together with the ui/ scaffold.
