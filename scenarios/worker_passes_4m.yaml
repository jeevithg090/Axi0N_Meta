# Golden run T02 (1 Nov campaign), recorded live on 2 Nov (scenarios/README.md, "Recording T02 and
# T04"): the worker walks past the moving forklift inside the 4 m rule, Glimmer confirms the
# violation and a verified alert is raised.
name: worker_passes_4m
description: >-
  A worker walks past a moving forklift about 2.9 m from it. The planner compiles "keep people
  at least 4 m away from a moving forklift"; the rule fires, Glimmer looks at the strip and
  confirms the violation, and a verified alert is raised.
steps:
  - {id: plan, kind: demo.plan, params: {fixture: scenarios/worker_passes_4m}}
  - {id: rule_ci, kind: demo.rule_ci, params: {fixture: scenarios/worker_passes_4m}}
  - {id: evidence, kind: demo.evidence, params: {fixture: scenarios/worker_passes_4m}}
  - {id: verify, kind: demo.verify, params: {fixture: scenarios/worker_passes_4m}}
  - id: score
    kind: demo.score
    params:
      fixture: scenarios/worker_passes_4m
      eval_set: eval/clips
      gate: {min_alerts: 1, tier1_includes: violation}
