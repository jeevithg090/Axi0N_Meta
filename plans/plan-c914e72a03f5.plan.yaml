audit:
- by: spark-open
  reasoning_ref: spark-open-audit-c914e72a03f5
  text: Audited 4 rules against OSHA 1910.178, 1910.135, 1926.1424, and FDA Food Code.
    Operator exclusion warm-up guard (1.5s) verified active on forklift proximity
    rule; zero biometric or productivity tracking predicates present.
back_translation: '[en]

  - keep-people-2m-from-moving-forklift: Monitors forklifts and pedestrians across
  loading docks and aisles (CAM-01, CAM-02, CAM-04, CAM-10, CAM-11, phone-27). Triggers
  with HIGH severity when a person is within 2.0 m of a forklift moving faster than
  0.2 m/s (seated operators inside the cab are automatically excluded). Action: play
  audible warning and notify safety_officer immediately.

  - require-hardhat-in-visitor-corridor: Monitors the East Visitor & PPE Corridor
  (CAM-03, CAM-06, CAM-12). Triggers with MEDIUM severity when a person is inside
  the corridor without a safety helmet for over 2.0 s. Action: notify supervisor.

  - heavy-equipment-swing-radius-exclusion: Monitors the South Freight Gate and Yard
  Heavy Equipment Bay (CAM-08, CAM-09). Triggers with HIGH severity when a person
  is within 3.5 m of a moving excavator boom or backing truck (>0.15 m/s). Action:
  trip zone interlock and notify safety_officer.

  - commercial-kitchen-prep-sanitation-guard: Monitors Commercial Kitchen Prep Line
  A (CAM-05). Triggers with LOW severity when staff work at the prep line without
  a chef hat or hairnet for over 5.0 s. Action: notify kitchen_lead.

  [es]

  - keep-people-2m-from-moving-forklift: Monitorea montacargas y peatones en muelles
  y pasillos (CAM-01, CAM-02, CAM-04, CAM-10, CAM-11, phone-27). Se activa con severidad
  ALTA cuando una persona está a menos de 2.0 m de un montacargas en movimiento (>0.2
  m/s; el operador sentado queda excluido). Acción: alerta de voz inmediata y notificación
  al oficial de seguridad.

  - require-hardhat-in-visitor-corridor: Monitorea el Corredor Este de Visitantes
  y EPP (CAM-03, CAM-06, CAM-12). Se activa con severidad MEDIA cuando una persona
  entra sin casco de seguridad por más de 2.0 s. Acción: notificar al supervisor.

  - heavy-equipment-swing-radius-exclusion: Monitorea la Puerta Sur de Carga y Bahía
  de Maquinaria Pesada (CAM-08, CAM-09). Se activa con severidad ALTA cuando un peatón
  está a menos de 3.5 m de una excavadora o camión en movimiento. Acción: activar
  bloqueo de seguridad y notificar al oficial.

  - commercial-kitchen-prep-sanitation-guard: Monitorea la Línea de Preparación de
  Cocina Comercial A (CAM-05). Se activa con severidad BAJA cuando el personal trabaja
  sin gorro o malla para el cabello por más de 5.0 s.'
