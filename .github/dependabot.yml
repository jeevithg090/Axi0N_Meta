# Weekly dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem; a major update gets its own. The cooldown keeps the repo rule that a new release is at
# least two weeks old before we take it.
# Updates still go through the normal pull request checks; nothing merges on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
    open-pull-requests-limit: 3
