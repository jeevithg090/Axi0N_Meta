# PENDING golden run T04 (1 Nov campaign: the rule engine flags the seated driver, Glimmer says
# "the forklift operator seated inside the cab", no alert). Not under scenarios/ yet, so
# `make golden-verify` skips it: record it (scenarios/README.md, "Recording T02 and T04"), then
# `git mv scenarios/pending/driver_only_4m.yaml scenarios/`.
name: driver_only_4m
description: >-
  A forklift carries a roll through an empty bay; the only person is its seated driver. The 4 m
  rule raises a candidate on the driver, Glimmer looks at the strip, sees the operator in the
  cab and rejects it: no alert.
steps:
  - {id: plan, kind: demo.plan, params: {fixture: scenarios/driver_only_4m}}
  - {id: rule_ci, kind: demo.rule_ci, params: {fixture: scenarios/driver_only_4m}}
  - {id: evidence, kind: demo.evidence, params: {fixture: scenarios/driver_only_4m}}
  - {id: verify, kind: demo.verify, params: {fixture: scenarios/driver_only_4m}}
  - id: score
    kind: demo.score
    params:
      fixture: scenarios/driver_only_4m
      eval_set: eval/clips
      gate: {max_alerts: 0, tier1_includes: no_violation}
